# Runs the safe-utils proposal script unchanged, on a fork one block before nonce 447
# executed, and attests the request it would have posted. Nothing is sent.
# Needs an archive RPC: MAINNET_RPC_URL=https://eth.drpc.org ./attest.sh --config attest.capture.toml
producer_repo = "https://github.com/crossecute/forge-attest-example-aave-v4-steward"
producer_commit = "d0e88260f13adae4e020d6378087d66f72478bd6"
producer_setup = "git submodule update --init --recursive"
expected_forge_version = "1.8.1"

[[run]]
script = "script/ProposeRiskCouncilTx.s.sol:ProposeRiskCouncilTx"
capture = "safe-utils"
rpc_env = "MAINNET_RPC_URL"
# The Risk Council was at nonce 447 in this block; the transaction executed in the next.
fork_block = "26337525"

[run.env]
# A public test key for the script's local signing step. It is not an owner.
PRIVATE_KEY = "1"

[[run.claim]]
output_path = "captured/nonce447.json"
input_format = "safe-service"
input_profile = "safe-utils"
safe_version = "1.3.0"
chain_id = "1"
safe_network = "ethereum"
safe_address = "0x47c71dFEB55Ebaa431Ae3fbF99Ea50e0D3d30fA8"
safe_nonce = "447"
expected_output_sha256 = "37f6e7c1db2939f5403baf09f52570b01e9fb5033053dd58b799d7e2587a02af"
expected_canonical_sha256 = "ef44057e9ceb6bd572b849d9fa56cd111882290ff1c50c5c289eb14deae15d10"
expected_safe_tx_hash = "0x0ea9a8fed74bc267e88a5de190ca88a3c63b5963784f50176bfd0f4fb523f8e4"
